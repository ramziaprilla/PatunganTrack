<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Patungan</title>
</head>
<body>
  <h1>Dashboard Patungan</h1>

  <p id="userEmail"></p>

  <form id="groupForm">
    <input id="groupName" type="text"
      placeholder="Nama grup patungan" required>

    <button type="submit">Buat Grup</button>
  </form>

  <p id="message"></p>

  <h2>Grup Saya</h2>
  <ul id="groupList"></ul>

  <button id="logoutButton">Logout</button>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
