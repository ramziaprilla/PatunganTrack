<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PatunganTrack - Masuk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <div class="auth-container">
    <main class="auth-form-section">
      <div class="form-wrapper">
        <div class="auth-brand-logo">
          <img src="Logo-PatunganTrack.png" alt="PatunganTrack Logo" class="app-logo-img">
        </div>

        <span class="auth-subtitle-orange">PATUNGAN LEBIH CERDAS</span>
        <h1 class="auth-title">Selamat datang<br>kembali.</h1>
        <p class="auth-desc">Buat setiap pengeluaran bersama tetap jelas, adil, dan bebas ribet.</p>

        <div class="auth-tabs">
          <button type="button" class="auth-tab active" id="tab-masuk">Masuk</button>
          <button type="button" class="auth-tab" id="tab-daftar">Buat Akun</button>
        </div>

        <form class="auth-form" id="login-form">
          <div class="input-group">
            <label for="email">Alamat email</label>
            <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
          </div>

          <div class="input-group">
            <label for="password">Kata sandi</label>
            <div class="password-input-wrapper">
              <input type="password" id="password" name="password" placeholder="Masukkan kata sandi" minlength="6" autocomplete="current-password" required>
              <button type="button" class="toggle-password-icon" aria-label="Tampilkan kata sandi">👁️</button>
            </div>
          </div>

          <button type="submit" class="btn-submit-orange">Masuk ke PatunganTrack <span class="arrow-icon">→</span></button>
          <p id="auth-message" class="auth-message" role="status"></p>
        </form>
      </div>
    </main>

    <aside class="auth-banner-section">
      <div class="banner-content">
        <div class="banner-tag">
          <span class="line-decorator">—</span> DIBUAT UNTUK KEBERSAMAAN
        </div>
        <h2 class="banner-headline">Patungan adil.<br>Hidup maksimal.</h2>
        <p class="banner-subtext">Pantau pengeluaran, lunasi tagihan, dan raih tujuan bersama — semua di satu tempat.</p>
      </div>
      <div class="banner-bg-dots"></div>
    </aside>
  </div>

  <script type="module" src="js/auth.js"></script>
</body>
</html>
