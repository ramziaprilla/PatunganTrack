<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PatunganTrack - Notifikasi</title>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/notifications.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="dashboard-container">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <img src="Logo-PatunganTrack.png" alt="PatunganTrack Logo" class="brand-logo">
        <span class="brand-title">PatunganTrack</span>
      </div>

      <nav class="sidebar-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span> Home</a>
        <a href="groups.html" class="nav-item"><span class="nav-icon">👥</span> Grup Patungan</a>
        <a href="notifications.html" class="nav-item active"><span class="nav-icon">🔔</span> Notifikasi</a>
        <a href="account.html" class="nav-item"><span class="nav-icon">⚙️</span> Akun</a>
      </nav>

      <div class="sidebar-footer">
        <button id="logout-btn" class="btn-logout"><span class="nav-icon">↪</span> Keluar Akun</button>
      </div>
    </aside>

    <main class="main-content">

      <header class="topbar">
        <div class="topbar-right">
          <a href="notifications.html" class="icon-btn" aria-label="Notifikasi">🔔</a>
          <div class="user-profile">
            <div class="avatar-circle"></div>
            <span class="user-name"></span>
          </div>
        </div>
      </header>

      <section class="notif-header-section">
        <div class="notif-title-area">
          <h1>Notifikasi <span class="badge-pill-orange" id="notif-baru" hidden></span></h1>
          <p class="section-desc">Pengingat tenggat, tagihan yang belum lunas, dan aktivitas grup patungan kamu.</p>
        </div>
        <div class="header-action-btns">
          <button type="button" class="btn-mark-all" id="btn-baca-semua">✓ Tandai Semua Sudah Dibaca</button>
        </div>
      </section>

      <section class="notif-filter-bar">
        <div class="filter-pills" role="group" aria-label="Filter notifikasi">
          <button type="button" class="pill active" data-filter="semua">Semua (<span data-count="semua">0</span>)</button>
          <button type="button" class="pill" data-filter="tagihan">Tagihan & Pembayaran (<span data-count="tagihan">0</span>)</button>
          <button type="button" class="pill" data-filter="grup">Aktivitas Grup (<span data-count="grup">0</span>)</button>
          <button type="button" class="pill" data-filter="sistem">Sistem (<span data-count="sistem">0</span>)</button>
        </div>
        <span class="notif-count-text" id="notif-info"></span>
      </section>

      <section class="notif-list" id="notif-list"></section>
      <p class="empty-state" id="notif-empty" hidden></p>

    </main>
  </div>

  <script type="module" src="js/notifications.js"></script>
</body>
</html>
